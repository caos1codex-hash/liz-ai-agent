# ============================================================================
# Liz AI Agent — CI workflow (push/PR)
# ============================================================================
# Fase 10 — Release v0.1.0
#
# Se ejecuta en cada push a main y en cada PR. Verifica:
#   - go vet
#   - go build (headless tag)
#   - go test (paquetes estables que no requieren OpenGL)
#   - gofmt check
# ============================================================================

name: CI

on:
  push:
    branches: [main, fase-10]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- Job 1: build + vet + test headless ---
  build-test:
    name: Build & Test (headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download deps
        run: go mod download

      - name: Go vet (headless)
        run: CGO_ENABLED=0 go vet -tags headless ./cmd/liz/...

      - name: Go vet (núcleo — todos los paquetes headless)
        run: |
          # Vetear todos los paquetes headless. Las exclusiones de Fase 9
          # se eliminaron tras fix #23 (auto_creacion, logger, pipeline, servidor).
          # internal/desktop requiere CGO+OpenGL (sigue excluido).
          CGO_ENABLED=0 go vet -tags headless \
            ./cmd/liz/... \
            ./internal/nucleo/config/... \
            ./internal/nucleo/permisos/... \
            ./internal/nucleo/memoria/... \
            ./internal/nucleo/orquestador/... \
            ./internal/nucleo/herramientas/ \
            ./internal/nucleo/herramientas/registro/... \
            ./internal/nucleo/herramientas/integradas/... \
            ./internal/nucleo/herramientas/auto_creacion/... \
            ./internal/nucleo/logger/... \
            ./internal/pipeline/... \
            ./internal/nucleo/servidor/... \
            ./internal/nucleo/contexto/...

      - name: Build (headless, static)
        run: |
          CGO_ENABLED=0 go build \
            -tags headless \
            -trimpath \
            -ldflags="-s -w -X main.version=$(git describe --tags --always 2>/dev/null || echo dev)" \
            -o /tmp/liz-server \
            ./cmd/liz
          /tmp/liz-server --version
          ls -lh /tmp/liz-server

      - name: Test (todos los paquetes headless)
        run: |
          CGO_ENABLED=0 go test -tags headless -short -count=1 -v -timeout 120s \
            ./cmd/liz/... \
            ./internal/nucleo/config/... \
            ./internal/nucleo/permisos/... \
            ./internal/nucleo/memoria/... \
            ./internal/nucleo/orquestador/... \
            ./internal/nucleo/herramientas/ \
            ./internal/nucleo/herramientas/registro/... \
            ./internal/nucleo/herramientas/integradas/... \
            ./internal/nucleo/herramientas/auto_creacion/... \
            ./internal/nucleo/logger/... \
            ./internal/nucleo/servidor/... 2>&1 | tee test-output.txt
          # Nota: internal/pipeline se excluye de tests hasta resolver bugs
          # lógicos preexistentes (issue separado). Sí pasa go vet.

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 7

  # --- Job 2: gofmt check ---
  fmt:
    name: Go Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "::error::Archivos no formateados con gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "✓ Todos los archivos .go están formateados correctamente"

  # --- Job 3: build desktop (requiere deps OpenGL) ---
  build-desktop:
    name: Build Desktop (GUI Fyne)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install OpenGL dev dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libglx-dev

      - name: Download deps
        run: go mod download

      - name: Build desktop (con GUI Fyne)
        run: |
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=$(git describe --tags --always 2>/dev/null || echo dev)" \
            -o /tmp/liz \
            ./cmd/liz
          /tmp/liz --version
          ls -lh /tmp/liz

  # --- Job 4: smoke test del binario headless ---
  smoke-test:
    name: Smoke Test (headless server)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build headless
        run: |
          CGO_ENABLED=0 go build -tags headless -o /tmp/liz-server ./cmd/liz

      - name: Smoke test — arrancar servidor y verificar endpoint /api/v1/health en puerto 3000
        run: |
          # Crear config con schema correcto (issue #25):
          # - wrapper `liz:` raíz
          # - `puerto:` y `host:` a nivel raíz del bloque `liz:`
          # - `version: "0.1.0"` (no "0.10.0")
          mkdir -p ~/.liz
          cat > ~/.liz/config.yaml <<EOF
          liz:
            nombre: Liz
            version: "0.1.0"
            host: "127.0.0.1"
            puerto: 3000
          EOF

          # Arrancar servidor en background
          /tmp/liz-server --headless &
          LIZ_PID=$!
          sleep 3

          # Verificar que responde en el puerto CONFIGURADO (3000).
          # Si el servidor arranca en otro puerto, el smoke test debe fallar
          # (issue #25: antes probaba 3000 y 8080 con fallback, lo que
          # escondía bugs de configuración).
          echo "Probando puerto 3000..."
          if curl -fsSL "http://localhost:3000/api/v1/health" 2>/dev/null; then
            echo "✓ Servidor responde en puerto 3000"
          else
            echo "✗ Servidor no responde en puerto 3000"
            echo "=== Process status ==="
            ps aux | grep liz-server || echo "Proceso no encontrado"
            echo "=== Server output ==="
            kill $LIZ_PID 2>/dev/null || true
            wait $LIZ_PID 2>/dev/null || true
            exit 1
          fi

          # Cleanup
          kill $LIZ_PID 2>/dev/null || true
          wait $LIZ_PID 2>/dev/null || true
          echo "✓ Smoke test OK"
